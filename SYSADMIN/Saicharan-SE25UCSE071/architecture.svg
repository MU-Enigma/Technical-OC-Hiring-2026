<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AssetVault lab architecture</title>
<desc>Three VMs on an isolated internal network: client and Kali attacker both reach the server's AssetVault service on port 8080, the server runs three logging layers, and the sudoers misconfiguration is a separate privilege escalation path shown as a note.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="520" fill="#ffffff"/>

<rect x="30" y="30" width="620" height="460" rx="20" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="6 4"/>
<text x="52" y="56" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">Isolated internal network</text>
<text x="52" y="74" font-family="sans-serif" font-size="12" fill="#5f5e5a">10.0.1.0/24, no host or internet path</text>

<g>
<rect x="60" y="100" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="135" y="122" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Client VM</text>
<text x="135" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">10.0.1.20, browser</text>
</g>

<g>
<rect x="470" y="100" width="150" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="545" y="122" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Kali VM</text>
<text x="545" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">10.0.1.30, attacker</text>
</g>

<text x="135" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Upload / open (HTTP)</text>
<line x1="135" y1="160" x2="330" y2="215" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<text x="545" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Malicious upload + reverse shell</text>
<line x1="545" y1="160" x2="350" y2="215" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="130" y="220" width="420" height="90" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="242" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Server VM (10.0.1.10)</text>
<text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">AssetVault Flask service, port 8080</text>
<text x="340" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Runs as svc_vault (low privilege)</text>
<text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Vulnerable: /open executes uploaded files (CWE-434)</text>
</g>

<line x1="340" y1="310" x2="340" y2="340" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="350" width="170" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="145" y="372" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">journald</text>
<text x="145" y="392" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">systemd service events</text>
<text x="145" y="408" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">journalctl -u assetvault</text>
</g>

<g>
<rect x="255" y="350" width="170" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="372" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">assetvault.log</text>
<text x="340" y="392" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">app-level requests</text>
<text x="340" y="408" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">sees entry point only</text>
</g>

<g>
<rect x="450" y="350" width="170" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="535" y="372" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">auditd</text>
<text x="535" y="392" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">sudoers, python3 exec,</text>
<text x="535" y="408" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">/bin/bash spawn (keyed)</text>
</g>

<rect x="60" y="440" width="560" height="40" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="340" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Independent flaw: sudoers grants svc_vault NOPASSWD python3 -- root escalation, patched separately</text>
</svg>
